<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0A1A"/>
      <stop offset="100%" stop-color="#1A002E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#F5E040"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <radialGradient id="burstGrad" cx="50%" cy="50%" r="50%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F5E040" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background with burst effect -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>
  <ellipse cx="540" cy="400" rx="600" ry="300" fill="url(#burstGrad)"/>
  
  <!-- BIG WIN overlay -->
  <g transform="translate(540, 350)">
    <text x="0" y="0" font-family="Impact, sans-serif" font-size="96" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" stroke="#0A0A1A" stroke-width="4" paint-order="stroke fill">BIG WIN!</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="36" fill="#E8D5B7" text-anchor="middle">3 Huntress Queens Triggered Bonus!</text>
  </g>
  
  <!-- Animated win counter -->
  <g transform="translate(540, 500)">
    <rect x="-200" y="-60" width="400" height="120" rx="20" fill="#0A0A1A" stroke="#D4AF37" stroke-width="4"/>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="20" fill="#B8A080" text-anchor="middle">WIN AMOUNT</text>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">25,000</text>
  </g>
  
  <!-- Bonus game type -->
  <g transform="translate(540, 680)">
    <rect x="-180" y="-30" width="360" height="60" rx="30" fill="url(#purpleGrad)"/>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">👑 BONUS ROUND: COIN FLIP 👑</text>
  </g>
  
  <!-- Coin flip animation area -->
  <g transform="translate(540, 850)">
    <!-- Coin -->
    <circle cx="0" cy="0" r="120" fill="url(#goldGrad)" stroke="#D4AF37" stroke-width="6"/>
    <circle cx="0" cy="0" r="100" fill="#F5E040"/>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="60" fill="#B8860A" text-anchor="middle">2X</text>
    <!-- Spinning indicator -->
    <path d="M-80 -80 A80 80 0 0 1 80 -80" stroke="#FFD700" stroke-width="8" fill="none" stroke-dasharray="50,100" stroke-linecap="round"/>
    <path d="M80 80 A80 80 0 0 1 -80 80" stroke="#FFD700" stroke-width="8" fill="none" stroke-dasharray="50,100" stroke-linecap="round"/>
  </g>
  
  <!-- Particle effects (coin burst) -->
  <g fill="#FFD700" opacity="0.8">
    <circle cx="200" cy="600" r="8"/>
    <circle cx="880" cy="620" r="6"/>
    <circle cx="150" cy="750" r="10"/>
    <circle cx="930" cy="780" r="7"/>
    <circle cx="250" cy="900" r="5"/>
    <circle cx="830" cy="920" r="9"/>
    <circle cx="100" cy="1000" r="6"/>
    <circle cx="980" cy="1020" r="8"/>
  </g>
  
  <!-- Confetti -->
  <g>
    <rect x="100" y="550" width="12" height="20" fill="#FF3366" transform="rotate(15 106 560)"/>
    <rect x="980" y="570" width="10" height="18" fill="#9333EA" transform="rotate(-20 985 579)"/>
    <rect x="150" y="720" width="14" height="22" fill="#FFD700" transform="rotate(30 157 731)"/>
    <rect x="930" y="740" width="12" height="20" fill="#FF85A0" transform="rotate(-10 936 750)"/>
  </g>
  
  <!-- Continue button -->
  <g transform="translate(540, 1300)">
    <ellipse cx="0" cy="0" rx="180" ry="60" fill="url(#purpleGrad)" stroke="#FFD700" stroke-width="3"/>
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">CONTINUE</text>
  </g>
  
  <!-- Device frame label -->
  <text x="540" y="1890" font-family="Arial, sans-serif" font-size="14" fill="#5A4A3A" text-anchor="middle">Rolling in the Dough - Big Win Bonus Screen</text>
</svg>