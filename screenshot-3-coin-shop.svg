<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0A1A"/>
      <stop offset="100%" stop-color="#1A0A2E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#F5E040"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#90EE90"/>
      <stop offset="50%" stop-color="#4DC83A"/>
      <stop offset="100%" stop-color="#2D8A20"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>
  
  <!-- Top bar -->
  <rect x="0" y="0" width="1080" height="120" fill="#0A0A1A" opacity="0.9"/>
  <text x="60" y="65" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#goldGrad)">Rolling in the Dough</text>
  <text x="60" y="95" font-family="Arial, sans-serif" font-size="16" fill="#E8D5B7">Sweepstakes Slots</text>
  
  <!-- Balance -->
  <g transform="translate(700, 30)">
    <rect x="0" y="0" width="320" height="60" rx="12" fill="#1A1A2E" stroke="#3A2A1A" stroke-width="2"/>
    <text x="20" y="22" font-family="Arial, sans-serif" font-size="14" fill="#B8A080">Gold Coins</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFD700">10,000</text>
    <text x="180" y="22" font-family="Arial, sans-serif" font-size="14" fill="#60B060">Sweeps Coins</text>
    <text x="180" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#90EE90">500</text>
  </g>
  
  <!-- Shop Title -->
  <text x="540" y="180" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">COIN SHOP</text>
  <text x="540" y="220" font-family="Arial, sans-serif" font-size="18" fill="#E8D5B7" text-anchor="middle">Purchase Sweeps Coins to Play for Real Cash Prizes</text>
  
  <!-- Currency tabs -->
  <g transform="translate(540, 280)">
    <rect x="-150" y="0" width="300" height="60" rx="30" fill="#1A1A2E" stroke="#3A2A1A" stroke-width="2"/>
    <rect x="-148" y="2" width="146" height="56" rx="28" fill="#2A2A3E"/>
    <text x="-75" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#B8A080" text-anchor="middle">GOLD</text>
    <rect x="2" y="2" width="146" height="56" rx="28" fill="url(#greenGrad)"/>
    <text x="75" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0A0A1A" text-anchor="middle">SWEEPS</text>
  </g>
  
  <!-- Coin packages -->
  <g font-family="Arial, sans-serif">
    <!-- Package 1 -->
    <g transform="translate(100, 380)">
      <rect x="0" y="0" width="380" height="300" rx="20" fill="#1A1A2E" stroke="#3A2A1A" stroke-width="2"/>
      <text x="190" y="40" font-size="24" font-weight="bold" fill="#FFD700" text-anchor="middle">STARTER</text>
      <g transform="translate(190, 110)">
        <circle cx="0" cy="0" r="50" fill="url(#greenGrad)"/>
        <text x="0" y="18" font-size="36" font-weight="bold" fill="#0A0A1A" text-anchor="middle">500</text>
      </g>
      <text x="190" y="210" font-size="20" fill="#E8D5B7" text-anchor="middle">Green Sweeps Coins</text>
      <rect x="40" y="240" width="300" height="50" rx="25" fill="url(#greenGrad)"/>
      <text x="190" y="275" font-size="20" font-weight="bold" fill="white" text-anchor="middle">$4.99</text>
    </g>
    
    <!-- Package 2 - Popular -->
    <g transform="translate(580, 350)">
      <rect x="0" y="0" width="400" height="360" rx="20" fill="#1A1A2E" stroke="#FFD700" stroke-width="3"/>
      <rect x="100" y="-20" width="200" height="40" rx="20" fill="#FFD700"/>
      <text x="200" y="10" font-size="16" font-weight="bold" fill="#0A0A1A" text-anchor="middle">MOST POPULAR</text>
      <text x="200" y="60" font-size="28" font-weight="bold" fill="#FFD700" text-anchor="middle">BEST VALUE</text>
      <g transform="translate(200, 130)">
        <circle cx="0" cy="0" r="60" fill="url(#greenGrad)"/>
        <text x="0" y="22" font-size="42" font-weight="bold" fill="#0A0A1A" text-anchor="middle">1,500</text>
      </g>
      <text x="200" y="230" font-size="22" fill="#E8D5B7" text-anchor="middle">Green Sweeps Coins</text>
      <text x="200" y="260" font-size="16" fill="#90EE90" text-anchor="middle">+ 500 Bonus Gold Coins!</text>
      <rect x="40" y="290" width="320" height="60" rx="30" fill="url(#greenGrad)"/>
      <text x="200" y="330" font-size="24" font-weight="bold" fill="white" text-anchor="middle">$14.99</text>
    </g>
    
    <!-- Package 3 -->
    <g transform="translate(100, 730)">
      <rect x="0" y="0" width="380" height="300" rx="20" fill="#1A1A2E" stroke="#3A2A1A" stroke-width="2"/>
      <text x="190" y="40" font-size="24" font-weight="bold" fill="#FFD700" text-anchor="middle">HIGH ROLLER</text>
      <g transform="translate(190, 110)">
        <circle cx="0" cy="0" r="50" fill="url(#greenGrad)"/>
        <text x="0" y="18" font-size="36" font-weight="bold" fill="#0A0A1A" text-anchor="middle">5,000</text>
      </g>
      <text x="190" y="210" font-size="20" fill="#E8D5B7" text-anchor="middle">Green Sweeps Coins</text>
      <rect x="40" y="240" width="300" height="50" rx="25" fill="url(#greenGrad)"/>
      <text x="190" y="275" font-size="20" font-weight="bold" fill="white" text-anchor="middle">$49.99</text>
    </g>
    
    <!-- Package 4 -->
    <g transform="translate(580, 730)">
      <rect x="0" y="0" width="380" height="300" rx="20" fill="#1A1A2E" stroke="#3A2A1A" stroke-width="2"/>
      <text x="190" y="40" font-size="24" font-weight="bold" fill="#FFD700" text-anchor="middle">VIP ELITE</text>
      <g transform="translate(190, 110)">
        <circle cx="0" cy="0" r="50" fill="url(#greenGrad)"/>
        <text x="0" y="18" font-size="36" font-weight="bold" fill="#0A0A1A" text-anchor="middle">12,000</text>
      </g>
      <text x="190" y="210" font-size="20" fill="#E8D5B7" text-anchor="middle">Green Sweeps Coins</text>
      <rect x="40" y="240" width="300" height="50" rx="25" fill="url(#greenGrad)"/>
      <text x="190" y="275" font-size="20" font-weight="bold" fill="white" text-anchor="middle">$99.99</text>
    </g>
  </g>
  
  <!-- Cash Out Info -->
  <g transform="translate(540, 1100)">
    <rect x="-400" y="0" width="800" height="180" rx="20" fill="#0A0A1A" stroke="#2D8A20" stroke-width="2"/>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#90EE90" text-anchor="middle">CASH OUT REAL MONEY</text>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="18" fill="#E8D5B7" text-anchor="middle">100 Green Sweeps Coins = $1.00 USD</text>
    <text x="0" y="95" font-family="Arial, sans-serif" font-size="18" fill="#E8D5B7" text-anchor="middle">Minimum Cash Out: $5.00 (500 Coins)</text>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="16" fill="#B8A080" text-anchor="middle">Processed via Square - 1-3 Business Days - Sweepstakes Compliant</text>
    <rect x="-120" y="140" width="240" height="45" rx="22" fill="url(#greenGrad)"/>
    <text x="0" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0A0A1A" text-anchor="middle">REQUEST CASH OUT</text>
  </g>
  
  <!-- Security badges -->
  <g transform="translate(540, 1320)">
    <text x="-200" y="0" font-size="14" fill="#B8A080" text-anchor="middle">Square Secure</text>
    <text x="0" y="0" font-size="14" fill="#B8A080" text-anchor="middle">Sweepstakes Compliant</text>
    <text x="200" y="0" font-size="14" fill="#B8A080" text-anchor="middle">Anti-Cheat Protected</text>
  </g>
  
  <!-- Bottom nav -->
  <g transform="translate(0, 1800)">
    <rect x="0" y="0" width="1080" height="120" fill="#0A0A1A" opacity="0.95"/>
    <g font-family="Arial, sans-serif" font-size="24" fill="#E8D5B7" text-anchor="middle">
      <text x="180" y="65">LOBBY</text>
      <text x="540" y="65">SHOP</text>
      <text x="900" y="65">REWARDS</text>
    </g>
  </g>
  
  <!-- Device frame label -->
  <text x="540" y="1890" font-family="Arial, sans-serif" font-size="14" fill="#5A4A3A" text-anchor="middle">Rolling in the Dough - Coin Shop and Cash Out</text>
</svg>